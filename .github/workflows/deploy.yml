name: Deploy Proverbiando - Android
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy Proverbiando - Android'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production



jobs:
  build:
    name: build app
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup java 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: temurin

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4


      - name: setup flutter
        uses: subosito/flutter-action@v2.10.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: pub get
        run: flutter pub get

      - name: build appbundle
        run: flutter build appbundle  --release --obfuscate

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_CONSOLE_KEY }}
          packageName: com.thedevjeff.proverbiando
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.environment }}


