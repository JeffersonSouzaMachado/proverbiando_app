name: Deploy Proverbiando - Android
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy Proverbiando - Android'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production



jobs:
  build:
    name: Build APP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup java 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Setup flutter
        uses: subosito/flutter-action@v2.10.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Pub get
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/app/outputs/symbols

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_CONSOLE_KEY }}
          packageName: com.thedevjeff.proverbiando
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.environment }}


